name: SearchRank CI and installable ZIP
on:
  push:
    branches: [develop-1.2.4]
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: searchrank-dist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax
        run: find . -path './dist' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l

  dist:
    name: Build and publish installable ZIP
    needs: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build Geeklog archive
        shell: bash
        run: |
          set -euo pipefail
          filename="searchrank_1.2.4_2.1.3.zip"
          mkdir -p dist
          staging="$(mktemp -d)"
          mkdir -p "$staging/searchrank"
          for item in admin autoinstall.php docs functions.inc install_defaults.php install_updates.php language plugin.json sql README; do
            cp -R "$item" "$staging/searchrank/"
          done
          if find "$staging/searchrank" -iname '*pgsql*' | grep -q .; then
            echo "PostgreSQL artifacts are not supported" >&2
            exit 1
          fi
          (cd "$staging" && zip -X -q -r "$GITHUB_WORKSPACE/dist/$filename" searchrank)
          unzip -t "dist/$filename"
          unzip -Z -1 "dist/$filename" | grep -qx 'searchrank/autoinstall.php'
          unzip -Z -1 "dist/$filename" | grep -qx 'searchrank/functions.inc'
          unzip -Z -1 "dist/$filename" | grep -qx 'searchrank/sql/mysql_install.php'
          rm -rf "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: searchrank_1.2.4_2.1.3
          path: dist/searchrank_1.2.4_2.1.3.zip
          if-no-files-found: error
      - name: Commit archive in dist on development branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop-1.2.4'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/searchrank_1.2.4_2.1.3.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh installable SearchRank ZIP [skip ci]"
            git pull --rebase origin develop-1.2.4
            git push origin HEAD:develop-1.2.4
          fi
